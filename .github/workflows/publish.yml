name: Publish

on:
  push:
    paths:
      - "*.md"
      - "!README.md"
  workflow_dispatch:
  repository_dispatch:
    types:
      - trigger

jobs:
  hashnode-sync:
    runs-on: ubuntu-latest
    name: Hashnode Github Sync
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            *.md
            !README.md

      - name: Hashnode Github Sync
        uses: iammarmirza/hashnode-github-sync@v1.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          hashnode_host: ${{ secrets.HASHNODE_HOST }}
          hashnode_token: ${{ secrets.HASHNODE_TOKEN }}
          added_files: ${{ steps.changed-files.outputs.modified_files }}
          modified_files: ""
          deleted_files: ${{ steps.changed-files.outputs.deleted_files }}
          hashnode_event: ${{ toJson(github.event.client_payload) }}
